<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopOpti Product Importer</title>
  <style>
    body { width: 340px; margin: 0; padding: 16px; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
    h1 { margin: 0; font-size: 18px; }
    .muted { color: #64748b; font-size: 12px; }
    .card { margin-top: 14px; padding: 12px; background: white; border: 1px solid #e2e8f0; border-radius: 10px; }
    .hidden { display: none; }
    img { width: 100%; height: 170px; object-fit: contain; background: #f1f5f9; border-radius: 8px; }
    button { width: 100%; margin-top: 10px; padding: 10px 12px; border: 0; border-radius: 8px; cursor: pointer; font-weight: 600; }
    #extract { background: #0f172a; color: white; }
    #open-shopopti { background: #2563eb; color: white; }
    #status { margin-top: 10px; min-height: 16px; }
    #product-title { margin: 10px 0 4px; font-size: 14px; line-height: 1.35; }
    #product-price { margin: 0; font-weight: 700; }
  </style>
</head>
<body>
  <h1>ShopOpti</h1>
  <div class="muted">Import assisté AliExpress</div>

  <div class="card">
    <div class="muted">Aucune clé AliExpress ni token Shopify n’est stocké par cette extension.</div>
    <button id="extract">Analyser ce produit AliExpress</button>
    <div id="status" class="muted"></div>
  </div>

  <div id="preview" class="card hidden">
    <img id="product-image" alt="">
    <div id="product-title"></div>
    <p id="product-price"></p>
    <div id="verification" class="muted"></div>
    <button id="open-shopopti">Continuer dans ShopOpti</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
